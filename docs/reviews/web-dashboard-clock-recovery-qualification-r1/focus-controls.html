<!doctype html><html lang="en"><meta charset="utf-8"><title>Isolated Q1 focus controls</title>
<style>
:root{color-scheme:light}body{margin:0;padding:48px;background:#fff;color:#222;font:16px system-ui}.dark{background:#181818;color:#eee;color-scheme:dark}h1{font-size:18px;width:220px;height:30px;background:linear-gradient(90deg,#c13,#3b8,#38c);margin:0 0 25px}.controls{position:relative;width:270px;height:200px}button{box-sizing:border-box;border:1px solid #777;background:#eee;color:#222;width:100px;height:48px;margin:16px;outline:none}button:focus-visible{outline:3px solid #064ef5;outline-offset:3px}.dark button{background:#333;color:#fff}.dark button:focus-visible{outline-color:#6eaaff}.selected #target,.active #target{background:#bbd6e2}.masked #target{outline:3px solid #ddaa11;outline-offset:3px}.no-focus #target,.outline-none #target{outline:none!important}.transformed #target:focus-visible,.partial-occluded #target:focus-visible,.ring-occluded #target:focus-visible,.clipped #target:focus-visible{transform:scale(1.04)}.next-only #target{outline:2px solid #888!important}.next-overlap #target{outline:2px solid #888!important}.transformed-next-only #target{outline:none!important}.transformed-next-only #target:focus-visible{transform:scale(1.04)}.next-overlap #next{position:absolute;left:72px;top:12px;transform:scale(1.3)}.next-overlap #next:focus-visible{transform:scale(.8)}.occluder{position:absolute;inset:0;z-index:4;background:#eee;pointer-events:auto}.occluded .occluder{display:block}.occluder{display:none}.partial-occluded .occluder{display:block;inset:auto;left:16px;top:16px;width:32px;height:48px}.ring-occluded .occluder{display:block;inset:auto;left:10px;top:10px;width:112px;height:5px;pointer-events:none}.clipped .controls{overflow:hidden;width:115px}.unstable #target{animation:q1-wobble .2s infinite alternate}@keyframes q1-wobble{to{background:#910}}.scroll-box{height:220px;overflow:auto;width:300px}.long{height:800px}.scroll-drift .controls{height:900px}.ancestor-scroll .controls{height:900px}
</style><h1 id="anchor">Q1 inert measurement fixture</h1><div class="scroll-box"><div class="controls"><button id="target">Target</button><button id="next">Next</button><div class="occluder" aria-label="Inert occlusion control"></div></div><div class="long"></div></div>
<script>
const args=new URLSearchParams(location.search),variant=args.get('case')||'unselected';document.body.className=variant+' '+(args.get('theme')||'light');document.documentElement.lang=args.get('lang')||'en';
const target=document.querySelector('#target'),next=document.querySelector('#next');
if(variant==='missing-stop')next.addEventListener('focus',()=>target.remove(),{once:true});
if(variant==='body-landing')target.addEventListener('click',()=>target.remove(),{once:true});
// Drift is imposed after placing too, so the measurement cannot accidentally restore it away.
const drift=()=>{if(document.activeElement!==next)return;if(variant==='ancestor-scroll')document.querySelector('.scroll-box').scrollTop=33;if(variant==='scroll-drift'){document.body.style.minHeight='2200px';window.scrollTo(0,33);}};
if(variant==='duplicate-stop'){const middle=document.createElement('button');middle.id='middle';middle.textContent='Middle';next.before(middle);}
const desc=e=>e===document.body||e===document.documentElement?'body':e?.id==='target'?(variant==='transformed-next-only'||variant==='transformed'||variant==='next-overlap'||variant==='next-only'||variant==='partial-occluded'||variant==='ring-occluded'||variant==='clipped'?'outside:target':'clock:target:'+variant):e?.id==='next'?'outside:next':'other:'+e?.tagName;
const tabbables=()=>[...document.querySelectorAll('button')].filter(e=>e.tabIndex>=0&&!e.disabled&&e.getClientRects().length).map(desc);
window.__visual={activeDesc:()=>desc(document.activeElement),tabbables,focusInfo(){const e=document.activeElement;return{desc:desc(e),isBody:e===document.body||e===document.documentElement,focusVisible:e.matches(':focus-visible')};},async settle(){if(document.fonts)await document.fonts.ready;await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));drift();return{frames:2,running:document.getAnimations().filter(a=>a.playState==='running'&&a.effect.getComputedTiming().endTime!==Infinity).length};},probe(){const r=document.querySelector('#anchor').getBoundingClientRect();return{found:true,inViewport:true,rect:{left:r.left,top:r.top,width:r.width,height:r.height}};},scrollWindowTo(x){window.scrollTo(0,x==='end'?document.documentElement.scrollHeight-innerHeight:x);return{y:scrollY,max:document.documentElement.scrollHeight-innerHeight};}};
window.keyAudit=[];for(const type of ['keydown','keyup'])document.addEventListener(type,e=>keyAudit.push({type,key:e.key,trusted:e.isTrusted,shiftKey:e.shiftKey}),true);
</script></html>
