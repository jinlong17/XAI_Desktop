# supply-chain-security.yml — crypto-deps-lockdown (Wave W0, Phase 3)
# First CI workflow in this repo.
# Contract: packages/crypto-deps-lockdown/docs/api.md §1
#
# Four BLOCKING jobs:
#   rust-pins   — assert all 7 crypto crates use =x.y.z exact pins;
#                 assert Cargo.lock is in sync (--locked);
#                 assert no forbidden non-strict ed25519 verify pattern.
#   rfc-vectors — assert RFC 9106/8032/9180 vectors and CBOR AAD
#                 cross-implementation vectors pass.
#   cargo-deny  — advisories / bans / licenses / sources gate.
#   osv-scanner — OSV.dev advisory gate for npm/JS (pnpm-lock.yaml) and
#                 Cargo.lock (defense-in-depth).
#
# All third-party Actions are pinned to commit SHAs consistent with this
# row's own supply-chain thesis (reviewer recommendation R-3.2).
#
# Human ship step (R-4): flip each job to a GitHub "required status check"
# via repo Settings → Branches → branch protection after first CI run.

name: Supply-chain security

on:
  pull_request:
    branches: ["**"]
  push:
    branches: [main]

permissions:
  contents: read

jobs:

  # ── Job 1: rust-pins ────────────────────────────────────────────────────
  # Asserts: all 7 crypto crates are exact-pinned (=x.y.z), Cargo.lock is
  # in sync, and no forbidden non-strict ed25519 verify pattern exists.
  rust-pins:
    name: Rust exact pins + lock check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 1

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9  # stable as of 2026-05-19
        with:
          toolchain: stable

      - name: Assert exact pins on all 7 crypto crates
        run: bash scripts/ci/check-exact-pins.sh

      - name: Assert Cargo.lock is in sync (--locked)
        run: >
          cargo metadata
          --locked
          --manifest-path apps/desktop/src-tauri/Cargo.toml
          --format-version 1
          > /dev/null

      - name: Assert no forbidden non-strict ed25519 verify pattern (trip-wire)
        run: bash scripts/ci/check-verify-strict.sh

  # ── Job 1b: RFC vectors ─────────────────────────────────────────────────
  # Asserts: RFC 9106 Argon2id, RFC 8032 Ed25519, RFC 9180 HPKE, and
  # RFC 8949 deterministic CBOR AAD cross-implementation fixtures.
  rfc-vectors:
    name: RFC crypto vectors + CBOR cross-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 1

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9  # stable as of 2026-05-19
        with:
          toolchain: stable

      - name: Install Linux Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libglib2.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.0.0 --activate

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Python CBOR dependency
        run: python3 -m pip install cbor2==6.1.1

      - name: Run Rust RFC vector tests
        run: >
          cargo test
          --manifest-path apps/desktop/src-tauri/Cargo.toml
          --features crypto
          crypto::rfc_vectors

      - name: Assert CBOR AAD vectors match across cbor-x and cbor2
        run: bash scripts/ci/check-cbor-aad-cross-impl.sh

  # ── Job 2: cargo-deny ────────────────────────────────────────────────────
  # Asserts: zero RustSec advisories (except dated/reviewed ignores in
  # deny.toml), no banned crate versions, all licenses in allow list,
  # all sources are crates.io.
  cargo-deny:
    name: cargo-deny (advisories / bans / licenses / sources)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 1

      - name: Run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@0105f7c440bc8084c17cad47fe92e63049519458  # v2.0.18 pinned SHA
        with:
          command: check advisories bans licenses sources
          manifest-path: apps/desktop/src-tauri/Cargo.toml
          arguments: --all-features

  # ── Job 3: osv-scanner ────────────────────────────────────────────────────
  # Asserts: zero OSV.dev advisories for npm/JS packages (pnpm-lock.yaml)
  # and Rust packages (Cargo.lock).
  # The scanner binary is version-pinned and SHA256-verified because the
  # upstream GitHub Action wrapper has changed shape across releases.
  osv-scanner:
    name: OSV scanner (npm + Cargo)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 1

      - name: Install OSV scanner
        env:
          OSV_SCANNER_VERSION: v2.3.8
          OSV_SCANNER_SHA256: bc98e15319ed0d515e3f9235287ba53cdc5535d576d24fd573978ecfe9ab92dc
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/google/osv-scanner/releases/download/${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64" -o osv-scanner
          echo "${OSV_SCANNER_SHA256}  osv-scanner" | sha256sum -c -
          chmod +x osv-scanner
          sudo install -m 0755 osv-scanner /usr/local/bin/osv-scanner

      - name: Run OSV scanner
        run: |
          osv-scanner scan source \
            --config=scripts/ci/osv-scanner.toml \
            --lockfile=pnpm-lock.yaml \
            --lockfile=apps/desktop/src-tauri/Cargo.lock
